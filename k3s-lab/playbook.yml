---
- name: Installer le serveur K3s
  hosts: server
  become: yes
  tasks:
    - name: Installer K3s Server
      shell: |
        curl -sfL https://get.k3s.io | INSTALL_K3S_EXEC="server --node-ip 192.168.56.10 --tls-san 192.168.56.10 --write-kubeconfig-mode 644" sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Récupérer le token du serveur
      slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: k3s_token

    - name: Rapatrier le fichier kubeconfig sur la VM de lab
      fetch:
        src: /etc/rancher/k3s/k3s.yaml
        dest: ./k3s.yaml
        flat: yes

- name: Installer l'agent K3s
  hosts: agent
  become: yes
  tasks:
    - name: Installer K3s Agent
      shell: |
        curl -sfL https://get.k3s.io | K3S_URL=https://192.168.56.10:6443 K3S_TOKEN={{ hostvars[groups['server'][0]].k3s_token.content | b64decode }} sh -
      args:
        creates: /usr/local/bin/k3s  
