# 1. Le PersistentVolumeClaim (PVC)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
  namespace: tp14
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# 2. Le Deployment PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: tp14
spec:
  replicas: 1
  strategy:
    type: Recreate # Important pour ne pas monter le même volume deux fois
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password # <-- On utilise la clé 'password' comme dans ton fichier
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          
          # --- LE TODO EST ICI : LE MONTAGE DU VOLUME ---
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-pvc
---
# 3. Le Service pour accéder à Postgres
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: tp14
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
