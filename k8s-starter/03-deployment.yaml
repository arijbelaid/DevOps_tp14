apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: tp14
  labels:
    app: whoami
spec:
  replicas: 2
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.0
          args: ["--port", "8080"]
          ports:
            - name: http
              containerPort: 8080
          
          # --- PARTIE 4 : ConfigMap et Secret ---
          envFrom:
            - configMapRef:
                name: whoami-config
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: whoami-secret
                  key: api-key

          # --- PARTIE 5 : Probes ---
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10

          # --- PARTIE 5 : Resources ---
          resources:
            requests:
              cpu: 50m
              memory: 32Mi 
            limits:
              cpu: 200m
              memory: 64Mi 
