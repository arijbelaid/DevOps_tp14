apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whoami-ingress
  namespace: tp14
spec:
  rules:
  - host: "whoami.lab.local"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: whoami
            port:
              number: 80
      # --- LE TODO EST ICI ---
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: nginx-service # Le nom du service qu'on va créer
            port:
              number: 80
